  #   description: "My custom system"
  #   transport: http
  #   url: "https://my-server.azurewebsites.net/api"
  #   auth:
  #     type: api_key
  #     header: "x-functions-key"
  #     env_var: MY_SYSTEM_FUNCTION_KEY
  #   read_only: true

