  #     scopes:
  #       - "https://graph.microsoft.com/.default"
  #     client_secret_env_var: GRAPH_CLIENT_SECRET
  #   read_only: true

  # ---------------------------------------------------------------------------
  # EXAMPLE: OAuth — Interactive browser login (public client)
  # Omit client_secret_env_var to trigger interactive auth on first call.
  # ---------------------------------------------------------------------------
  # - label: sharepoint
  #   description: "SharePoint MCP (interactive OAuth)"
  #   transport: http
  #   url: "https://my-sp-mcp.azurewebsites.net/api"
  #   auth:
  #     type: oauth
  #     tenant_id: "${AZURE_TENANT_ID}"
  #     client_id: "${SP_CLIENT_ID}"
  #     scopes:
  #       - "https://graph.microsoft.com/Sites.Read.All"
  #   read_only: true

  # ---------------------------------------------------------------------------
  # EXAMPLE: Azure Identity — Azure Resource Manager
  # Uses DefaultAzureCredential (az login locally, managed identity deployed).
  # No secrets needed — the simplest auth for Azure-native services.
  # ---------------------------------------------------------------------------
  # - label: azure_resources
  #   description: "Azure Resource Manager MCP"
  #   transport: http
  #   url: "https://my-arm-mcp.azurewebsites.net/api"
  #   auth:
