[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[format]
line-length = 88
indent-width = 4
quote-style = "double"

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
